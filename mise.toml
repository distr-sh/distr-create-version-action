[tools]
node = "26"
pnpm = "12.23.0"

[tasks.build]
run = 'pnpm run build'
description = 'Bundle the action into dist/'

[tasks.lint]
run = 'pnpm run lint'

[tasks.format]
run = ['pnpm dedupe', 'pnpm run format']

[tasks."lint:renovate-config"]
run = "pnpm dlx --package renovate renovate-config-validator"
description = "Lint the renovate.json config file"
sources = ["renovate.json"]
